[package]
name = "archaeodash-desktop-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "archaeodash_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "archaeodash-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = { version = "2", features = [] }
archaeodash-application = { workspace = true }
archaeodash-contracts = { workspace = true }
archaeodash-desktop = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
