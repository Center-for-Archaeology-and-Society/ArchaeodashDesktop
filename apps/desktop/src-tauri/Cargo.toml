[package]
name = "archaeodash-desktop-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "archaeodash_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "archaeodash-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "=2.6.0"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
archaeodash-application = { workspace = true }
archaeodash-contracts = { workspace = true }
archaeodash-desktop = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }

# Win32 calls that give the window its icon at the right sizes
# (src/windows_icon.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }

# The workspace lints, except unsafe code is denied rather than forbidden so
# that src/windows_icon.rs (Win32 FFI) can opt in with #[allow(unsafe_code)].
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
