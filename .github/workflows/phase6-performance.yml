name: Phase 6 numerical performance evidence

on:
  workflow_dispatch:
    inputs:
      max_elapsed_seconds:
        description: Whole-benchmark time limit in seconds (ratified budget 10)
        type: string
        default: '10'
      max_peak_rss_bytes:
        description: Process peak resident-memory limit in bytes (ratified budget 128 MiB; Windows cannot measure peak RSS)
        type: string
        default: '134217728'

permissions:
  contents: read

jobs:
  capture:
    name: Numerical timing and memory (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test measurement and budget helpers
        run: python -B -m unittest discover -s scripts -p test_benchmark_phase6.py
      - name: Capture release benchmark
        shell: bash
        env:
          MAX_ELAPSED_SECONDS: ${{ inputs.max_elapsed_seconds }}
          # Windows cannot sample whole-process peak RSS; requesting a memory
          # limit there would fail on the missing measurement, so the ratified
          # Windows budget is the elapsed limit only.
          MAX_PEAK_RSS_BYTES: ${{ runner.os == 'Windows' && '' || inputs.max_peak_rss_bytes }}
        run: |
          args=()
          if [ -n "$MAX_ELAPSED_SECONDS" ]; then args+=(--max-elapsed-seconds "$MAX_ELAPSED_SECONDS"); fi
          if [ -n "$MAX_PEAK_RSS_BYTES" ]; then args+=(--max-peak-rss-bytes "$MAX_PEAK_RSS_BYTES"); fi
          python scripts/benchmark-phase6.py --output artifacts/phase6-benchmark.json "${args[@]}"
      - name: Preserve measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase6-performance-${{ matrix.os }}-${{ github.run_id }}
          path: artifacts/phase6-benchmark.json
          if-no-files-found: warn
