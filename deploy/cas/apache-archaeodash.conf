# ArchaeoDash hosted server at https://cas.rc.asu.edu/archaeodash/.
# Installed as /etc/apache2/conf-available/archaeodash-location.conf and
# included inside the cas.rc.asu.edu:443 <VirtualHost> in default-ssl.conf:
#     Include conf-available/archaeodash-location.conf
# The vhost is shared with every app on cas: run `apachectl configtest`
# before `systemctl reload apache2`.

# Downloads (desktop app builds) are files on disk, not proxied to the app.
# scripts/home2/deploy-desktop-cas.sh fills the folder and installs this file.
# BEGIN download
Alias /archaeodash/download/ /var/www/archaeodash-downloads/
<Directory /var/www/archaeodash-downloads>
    Options None
    AllowOverride None
    Require all granted
    ForceType application/octet-stream
    Header set Content-Disposition attachment
    Header set X-Content-Type-Options nosniff
</Directory>
# END download

# /archaeodash without the slash: send it to the app's root.
RedirectMatch 301 ^/archaeodash$ /archaeodash/

<Location /archaeodash/>
    # The app sees paths without the /archaeodash prefix. flushpackets keeps
    # job progress (server-sent events) streaming; timeout covers long runs.
    ProxyPass http://127.0.0.1:18787/ flushpackets=on timeout=600
    ProxyPassReverse http://127.0.0.1:18787/
    # The app sets cookies for "/"; scope them to /archaeodash/ so they are
    # not sent to the other apps on this host.
    ProxyPassReverseCookiePath / /archaeodash/
    # Slightly above the app's own 64 MiB request limit.
    LimitRequestBody 70000000
</Location>

# BEGIN download
# After the proxy section, so this longer match turns the proxy off here.
<Location /archaeodash/download/>
    ProxyPass !
</Location>
# END download
